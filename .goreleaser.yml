version: 2

project_name: z13gui-plus

builds:
  - id: z13gui
    binary: z13gui
    env:
      - CGO_ENABLED=1
    ldflags:
      - -s -w -X main.Version={{.Version}}
    goos:
      - linux
    goarch:
      - amd64

archives:
  - id: z13gui
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - contrib/z13gui.service
      - contrib/z13gui.desktop
      - contrib/99-z13gui-gamepad.rules

checksum:
  name_template: "checksums.txt"

nfpms:
  - id: z13gui-pkg
    package_name: z13gui-plus
    section: utils
    formats:
      - archlinux
      - deb
      - rpm
    homepage: https://github.com/aic0d3r/z13gui-plus
    maintainer: "aic0d3r <funforfreeapps@gmail.com>"
    description: Z13GUI+ GTK4 overlay companion for z13ctl
    license: Apache-2.0
    dependencies:
      - gtk4
      - gtk4-layer-shell
      - z13ctl
    provides:
      - z13gui
    conflicts:
      - z13gui
    replaces:
      - z13gui
    scripts:
      postinstall: contrib/nfpm/postinstall.sh
      preremove: contrib/nfpm/preremove.sh
      postremove: contrib/nfpm/postremove.sh
    contents:
      - src: LICENSE
        dst: /usr/share/licenses/z13gui-plus/LICENSE
      - src: contrib/z13gui.service
        dst: /usr/lib/systemd/user/z13gui.service
      - src: contrib/z13gui.desktop
        dst: /usr/share/applications/z13gui.desktop
      - src: contrib/99-z13gui-gamepad.rules
        dst: /usr/lib/udev/rules.d/99-z13gui-gamepad.rules
    overrides:
      deb:
        dependencies:
          - libgtk-4-1
          - libgtk4-layer-shell0
          - z13ctl
    archlinux:
      packager: "aic0d3r <funforfreeapps@gmail.com>"
    rpm:
      group: Applications/System

release:
  github:
    owner: aic0d3r
    name: z13gui-plus
  draft: false
  prerelease: auto
  # The annotated tag's message body becomes the top of the release notes,
  # followed by the auto-generated commit changelog. Write detailed notes with
  # `git tag -a vX.Y.Z` (opens an editor) or `git tag -a vX.Y.Z -F notes.md`.
  # Lightweight tags (no -a/-m) leave this empty and fall back to the changelog.
  header: |
    {{ .TagBody }}

    ---

    **z13gui-plus** is a compatibility-preserving distribution of
    [dahui/z13gui](https://github.com/dahui/z13gui). The installed command and
    runtime interfaces remain `z13gui`.
