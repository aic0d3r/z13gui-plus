site_name: Z13GUI+
site_url: https://aic0d3r.github.io/z13gui-plus
site_description: "GUI control for the 2025 ASUS ROG Flow Z13 on Linux: power profiles, TDP and fan-curve tuning, CPU undervolt, RGB lighting, battery charge limit, refresh rate, and live telemetry in a GTK4 overlay — KDE Plasma, Wayland, and Steam Gaming Mode. Compatible fork of dahui/z13gui."
site_author: aic0d3r

repo_url: https://github.com/aic0d3r/z13gui-plus
repo_name: aic0d3r/z13gui-plus
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: overrides
  # Same artwork as the launcher icon (assets/icon.svg, symlinked in so the
  # docs can never drift from what gets installed).
  logo: assets/icon.svg
  favicon: assets/icon.svg
  palette:
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - tables
  - pymdownx.snippets

nav:
  - Home: index.md
  - Getting Started:
    - Installation: installation.md
    - Quick Start: getting-started.md
  - Reference:
    - Configuration: configuration.md
    - Theming: theming.md
  - Contributing: contributing.md
  - Changelog: changelog.md
