site_name: Z13GUI+ · ROG Flow Z13 Linux Control Panel
site_url: https://aic0d3r.github.io/z13gui-plus/
site_description: >-
  Z13GUI+ is an Armoury Crate–style control panel for the 2025 ASUS ROG Flow Z13
  on Linux: performance profiles, TDP, fan curves, undervolt, RGB lighting,
  battery charge limit, and refresh rate on KDE Plasma, Wayland, and Steam Gaming Mode.
site_author: aic0d3r

repo_url: https://github.com/aic0d3r/z13gui-plus
repo_name: aic0d3r/z13gui-plus
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - tables
  - pymdownx.snippets

nav:
  - Home: index.md
  - Getting Started:
    - Installation: installation.md
    - Quick Start: getting-started.md
  - Reference:
    - Configuration: configuration.md
    - Theming: theming.md
  - Contributing: contributing.md
  - Changelog: changelog.md
